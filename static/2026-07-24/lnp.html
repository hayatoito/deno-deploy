<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Network Access Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 0 16px;
      color: #000000;
      background-color: #ffffff;
    }
    h1 {
      font-size: 24px;
      color: #1a73e8;
    }
    p {
      color: #5f6368;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      margin: 12px 0;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      background-color: #1557b0;
    }
    #log {
      margin-top: 20px;
      padding: 12px;
      background: #f1f3f4;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 80px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Local Network Access Test</h1>
  <p>
    Tap any of the buttons below to issue a fetch() request to a Local Network endpoint (localhost / Private IP).<br>
    On Android 17, missing OS permissions will trigger the permission reprompt infobar banner at the bottom of the screen.
  </p>

  <div style="margin: 16px 0;">
    <input type="text" id="customUrl" value="http://224.0.0.1:8000/" style="width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 8px;">
    <button class="btn" onclick="doFetch(document.getElementById('customUrl').value)">Fetch Custom URL</button>
  </div>

  <button class="btn" onclick="doFetch('http://224.0.0.1:8000/')">fetch("http://224.0.0.1:8000/") (Multicast)</button>
  <button class="btn" onclick="doFetch('http://[2a00:79e1:2000:3101::1]:8000/')">fetch IPv6 Subnet Target</button>
  <button class="btn" onclick="doFetch('http://192.168.1.1:8000/')">fetch("http://192.168.1.1:8000/") (Gateway)</button>
  <button class="btn" onclick="doFetch('http://192.168.1.200:8000/')">fetch("http://192.168.1.200:8000/") (Non-Gateway Host)</button>

  <div id="log">Log output will appear here...</div>

  <script>
    async function doFetch(url) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.textContent = `[${time}] Sending request to ${url}...\nCheck the bottom of the screen for the permission infobar banner.`;
      
      try {
        const response = await fetch(url, { mode: 'no-cors' });
        logDiv.textContent = `[${time}] Request sent (no-cors mode) to ${url}.\nResponse type: ${response.type}`;
      } catch (err) {
        logDiv.textContent = `[${time}] Fetch Error:\n${err.name}: ${err.message}\nIssuing fallback <img> tag request...`;
        const img = new Image();
        img.src = url;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const autoVal = params.get('auto');
      if (autoVal) {
        const seconds = parseInt(autoVal, 10) || 3;
        const logDiv = document.getElementById('log');
        logDiv.textContent = `Waiting ${seconds} seconds before initiating fetch to 192.168.1.200...`;
        setTimeout(() => {
          doFetch('http://192.168.1.200:8000/');
        }, seconds * 1000);
      }
    });
  </script>
</body>
</html>
